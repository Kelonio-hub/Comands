name: Registrar comandos de Discord

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'comandos.json'
      - 'deploy-commands.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-commands.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm install

      - name: Registrar comandos de Discord
        env:
          TOKEN: ${{ secrets.TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: node deploy-commands.js
