name: Registrar comandos de Discord

on:
  push:
    branches:
      - main
    paths:
      - 'comandos.json'
      - 'deploy-commands.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-commands.yml'
  workflow_dispatch:

jobs:
  deploy-commands:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Registrar comandos en Discord
        env:
          TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: node deploy-commands.js
